version: '3'
services:
  namenode:
    image: apache/hadoop:3.3.5
    hostname: namenode
    container_name: namenode
    user: root
    ports:
      - "9870:9870"   # Namenode web UI
      - "9000:9000"   # HDFS client connection
      - "50070:50070" # WebHDFS
    volumes:
      - namenode:/hadoop/dfs/name
      - ./start-namenode.sh:/start-namenode.sh
      - ./hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    environment:
      - ENSURE_NAMENODE_DIR=/hadoop/dfs/name
      - HADOOP_OPTS=-Ddfs.namenode.http-address=0.0.0.0:9870 -Ddfs.namenode.http-bind-host=0.0.0.0
    command: ["/bin/bash", "/start-namenode.sh"]
    networks:
      - hadoop_network

  datanode1:
    image: apache/hadoop:3.3.5
    container_name: datanode1
    hostname: datanode1
    user: root
    depends_on:
      - namenode
    ports:
      - "9864:9864"  # Datanode web UI
      - "9866:9866"  # Datanode data transfer
    volumes:
      - datanode1:/hadoop/dfs/data
      - ./start-datanode.sh:/start-datanode.sh
      - ./hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    environment:
      - DATANODE_HOSTNAME=160.191.162.36
      - HADOOP_OPTS=-Ddfs.datanode.http.hostname=160.191.162.36 -Ddfs.datanode.hostname=160.191.162.36
    command: ["/bin/bash", "/start-datanode.sh"]
    networks:
      - hadoop_network

  datanode2:
    image: apache/hadoop:3.3.5
    container_name: datanode2
    hostname: datanode2
    user: root
    depends_on:
      - namenode
    ports:
      - "9865:9864"  # Datanode web UI
      - "9867:9866"  # Datanode data transfer
    volumes:
      - datanode2:/hadoop/dfs/data
      - ./start-datanode.sh:/start-datanode.sh
      - ./hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    environment:
      - DATANODE_HOSTNAME=160.191.162.36
      - HADOOP_OPTS=-Ddfs.datanode.http.hostname=160.191.162.36 -Ddfs.datanode.hostname=160.191.162.36
    command: ["/bin/bash", "/start-datanode.sh"]
    networks:
      - hadoop_network

  datanode3:
    image: apache/hadoop:3.3.5
    container_name: datanode3
    hostname: datanode3
    user: root
    depends_on:
      - namenode
    ports:
      - "9869:9864"  # Datanode web UI
      - "9868:9866"  # Datanode data transfer
    volumes:
      - datanode3:/hadoop/dfs/data
      - ./start-datanode.sh:/start-datanode.sh
      - ./hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    environment:
      - DATANODE_HOSTNAME=160.191.162.36
      - HADOOP_OPTS=-Ddfs.datanode.http.hostname=160.191.162.36 -Ddfs.datanode.hostname=160.191.162.36
    command: ["/bin/bash", "/start-datanode.sh"]
    networks:
      - hadoop_network

volumes:
  namenode:
  datanode1:
  datanode2:
  datanode3:

networks:
  hadoop_network:
    driver: bridge
